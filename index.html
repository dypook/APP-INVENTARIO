<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>InvAuditor V17 Pro</title>
    <style>
        /* --- ESTÉTICA CLEAN WHITE iOS --- */
        :root {
            --bg-color: #f2f2f7;
            --card-bg: #ffffff;
            --text-primary: #1c1c1e;
            --text-secondary: #8e8e93;
            --accent-blue: #007aff;
            --accent-green: #34c759; /* Tee / OK */
            --accent-orange: #ff9500; /* Cruz */
            --accent-purple: #af52de; /* Central */
            --accent-cyan: #32ade6;   /* Lateral */
            --danger: #ff3b30;
            --border-radius: 12px;
            --shadow: 0 2px 8px rgba(0,0,0,0.05);
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-primary);
            margin: 0;
            padding: 0;
            padding-bottom: 80px; /* Espacio para navbar */
            -webkit-tap-highlight-color: transparent;
            user-select: none;
        }

        /* --- UI COMPONENTS --- */
        .header {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            padding: 15px 20px;
            position: sticky;
            top: 0;
            z-index: 100;
            border-bottom: 1px solid #e5e5ea;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .header h1 { margin: 0; font-size: 22px; font-weight: 700; }
        
        .btn {
            background: var(--accent-blue);
            color: white;
            border: none;
            padding: 10px 16px;
            border-radius: 8px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.1s;
        }
        .btn:active { transform: scale(0.96); }
        .btn-ghost { background: transparent; color: var(--accent-blue); }
        
        /* --- VISTAS --- */
        .view { display: none; padding: 15px; animation: fadeIn 0.2s ease; }
        .view.active { display: block; }
        
        @keyframes fadeIn { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }

        /* --- LISTA PROYECTOS --- */
        .card {
            background: var(--card-bg);
            border-radius: var(--border-radius);
            padding: 15px;
            margin-bottom: 15px;
            box-shadow: var(--shadow);
            position: relative;
        }
        .project-tag {
            display: inline-block;
            padding: 4px 8px;
            border-radius: 6px;
            font-size: 11px;
            font-weight: 700;
            text-transform: uppercase;
            margin-bottom: 5px;
        }
        .tag-standard { background: #e5f1ff; color: var(--accent-blue); }
        .tag-modular { background: #e0f8e5; color: var(--accent-green); }

        /* --- MAPA DE BALSAS (GRID SYSTEM) --- */
        .grid-container {
            display: grid;
            gap: 4px;
            overflow-x: auto;
            padding: 10px;
            background: #eef1f5;
            border-radius: var(--border-radius);
            margin-bottom: 20px;
            /* Se define dinámicamente en JS */
        }
        
        .grid-cell {
            background: #fff;
            border-radius: 4px;
            min-width: 50px;
            min-height: 50px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            font-size: 10px;
            font-weight: bold;
            text-align: center;
            position: relative;
            box-shadow: 0 1px 2px rgba(0,0,0,0.1);
            cursor: pointer;
        }
        
        /* Colores Técnicos */
        .cell-cage { background: transparent; border: 2px dashed #ccc; box-shadow: none; pointer-events: none; color: #999; }
        .cell-tee { background-color: white; border: 2px solid var(--accent-green); color: var(--accent-green); }
        .cell-side { background-color: white; border: 2px solid var(--accent-cyan); color: var(--accent-cyan); }
        .cell-cross { background-color: white; border: 2px solid var(--accent-orange); color: var(--accent-orange); }
        .cell-central { background-color: white; border: 2px solid var(--accent-purple); color: var(--accent-purple); }
        
        /* Estados de Auditoría (Relleno) */
        .grid-cell.status-ok { background-color: var(--accent-green) !important; color: white !important; border-color: var(--accent-green); }
        .grid-cell.status-issue { background-color: var(--danger) !important; color: white !important; border-color: var(--danger); }
        .grid-cell.status-pending { background-color: #fff; } /* Default */

        /* --- EXPLORADOR DE CARPETAS (TREE VIEW) --- */
        .tree-node { margin-left: 15px; border-left: 1px solid #ddd; padding-left: 10px; }
        .tree-header { padding: 10px 0; display: flex; align-items: center; cursor: pointer; font-size: 16px; }
        .tree-icon { margin-right: 8px; color: var(--accent-blue); font-weight: bold; }
        
        /* --- LISTADO Y BULK ACTIONS --- */
        .list-item {
            display: flex;
            align-items: center;
            padding: 12px;
            border-bottom: 1px solid #eee;
            background: white;
            transition: background 0.1s;
        }
        .list-item:active { background: #f0f0f0; }
        .item-check { margin-right: 15px; transform: scale(1.3); }
        .item-info { flex-grow: 1; }
        .item-title { font-weight: 600; font-size: 16px; }
        .item-sub { font-size: 13px; color: var(--text-secondary); }

        .bulk-bar {
            position: fixed;
            top: 0; left: 0; right: 0;
            background: var(--text-primary);
            color: white;
            padding: 15px;
            z-index: 200;
            display: none; /* Hidden by default */
            justify-content: space-between;
            align-items: center;
        }

        /* --- FORMULARIO POP-UP --- */
        .modal-overlay {
            position: fixed; top: 0; left: 0; w: 100%; h: 100%;
            background: rgba(0,0,0,0.5);
            z-index: 500;
            display: none;
            justify-content: flex-end;
            flex-direction: column;
        }
        .modal-sheet {
            background: white;
            border-radius: 20px 20px 0 0;
            padding: 25px;
            animation: slideUp 0.3s cubic-bezier(0.16, 1, 0.3, 1);
            max-height: 85vh;
            overflow-y: auto;
        }
        @keyframes slideUp { from { transform: translateY(100%); } to { transform: translateY(0); } }

        .form-group { margin-bottom: 20px; }
        .form-label { font-size: 12px; color: var(--text-secondary); text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 5px; display: block; }
        .form-input, .form-select {
            width: 100%; padding: 12px; font-size: 17px;
            border: 1px solid #e5e5ea; border-radius: 8px;
            background: #f9f9f9; box-sizing: border-box;
        }
        .input-row { display: flex; gap: 10px; align-items: center; }
        .mic-btn { font-size: 20px; background: none; border: none; cursor: pointer; }

        /* --- NAVBAR --- */
        .navbar {
            position: fixed; bottom: 0; left: 0; width: 100%;
            background: white; border-top: 1px solid #eee;
            display: flex; justify-content: space-around;
            padding: 10px 0; padding-bottom: max(10px, env(safe-area-inset-bottom));
            z-index: 90;
        }
        .nav-item { text-align: center; color: #999; font-size: 10px; flex: 1; cursor: pointer; }
        .nav-item.active { color: var(--accent-blue); font-weight: 600; }
        .nav-icon { font-size: 24px; display: block; margin-bottom: 2px; }

    </style>
</head>
<body>

    <div id="bulkBar" class="bulk-bar">
        <span id="selectedCount">0 seleccionados</span>
        <div>
            <button class="btn btn-ghost" style="color: #ff453a" onclick="deleteBulk()">Borrar</button>
            <button class="btn btn-ghost" style="color: white" onclick="cancelBulk()">Cancelar</button>
        </div>
    </div>

    <div class="header">
        <h1 id="pageTitle">Proyectos</h1>
        <div id="headerActions">
            <button class="btn" onclick="showNewProjectModal()">+ Nuevo</button>
        </div>
    </div>

    <div id="view-projects" class="view active">
        <div id="projectsList">
            </div>
    </div>

    <div id="view-map" class="view">
        <div style="margin-bottom: 10px; display:flex; justify-content:space-between;">
            <span style="font-weight:bold; color:var(--text-secondary)">Vista Estructural</span>
            <button class="btn-ghost" style="font-size:12px;" onclick="editGridSettings()">⚙️ Ajustar</button>
        </div>
        <div id="gridWrapper" class="grid-container">
            </div>
        <div style="margin-top:10px; font-size:12px; color:#666; display:flex; gap:10px; justify-content:center;">
            <span style="color:var(--accent-green)">● Tee</span>
            <span style="color:var(--accent-cyan)">● Lateral</span>
            <span style="color:var(--accent-orange)">● Cruz</span>
            <span style="color:var(--accent-purple)">● Central</span>
        </div>
    </div>

    <div id="view-files" class="view">
        <div style="margin-bottom:15px; display:flex; gap:10px;">
            <button class="btn" onclick="createFolder()" style="flex:1; background:#eee; color:#333">📁 Nueva Área</button>
        </div>
        <div id="fileTree">
            </div>
    </div>

    <div id="view-list" class="view">
        <input type="text" id="searchInput" class="form-input" placeholder="🔍 Buscar código, nombre..." onkeyup="renderList()" style="margin-bottom:15px;">
        <div id="inventoryList">
            </div>
    </div>

    <div class="navbar" id="navbar">
        <div class="nav-item active" onclick="nav('projects')">
            <span class="nav-icon">📁</span>Proyectos
        </div>
        <div class="nav-item" id="nav-map" onclick="nav('map')" style="display:none;">
            <span class="nav-icon">🗺️</span>Mapa
        </div>
        <div class="nav-item" id="nav-files" onclick="nav('files')" style="display:none;">
            <span class="nav-icon">📂</span>Carpetas
        </div>
        <div class="nav-item" id="nav-list" onclick="nav('list')" style="display:none;">
            <span class="nav-icon">📋</span>Lista
        </div>
    </div>

    <div id="modalNewProject" class="modal-overlay">
        <div class="modal-sheet">
            <h2>Nuevo Proyecto</h2>
            <div class="form-group">
                <label class="form-label">Nombre</label>
                <input type="text" id="npName" class="form-input" placeholder="Ej: Centro Punta Arena">
            </div>
            <div class="form-group">
                <label class="form-label">Tipo</label>
                <select id="npType" class="form-select" onchange="toggleProjectOptions()">
                    <option value="standard">Bodega / Estándar</option>
                    <option value="modular">Centro de Cultivo (Balsas)</option>
                </select>
            </div>
            <div id="modularOptions" style="display:none; background:#f0f0f5; padding:15px; border-radius:8px; margin-bottom:20px;">
                <label class="form-label">Configuración Balsa (Filas x Jaulas)</label>
                <div class="input-row">
                    <input type="number" id="npRows" class="form-input" value="2" placeholder="Filas">
                    <span>x</span>
                    <input type="number" id="npCols" class="form-input" value="6" placeholder="Jaulas">
                </div>
            </div>
            <div class="form-group">
                <label class="form-label">Modo Inicial</label>
                <select id="npMode" class="form-select">
                    <option value="survey">Levantamiento (Desde cero)</option>
                    <option value="audit">Auditoría (Carga y verifica)</option>
                </select>
            </div>
            <button class="btn" style="width:100%" onclick="createProject()">Crear Proyecto</button>
            <button class="btn btn-ghost" style="width:100%; margin-top:10px;" onclick="closeModal('modalNewProject')">Cancelar</button>
        </div>
    </div>

    <div id="modalItem" class="modal-overlay">
        <div class="modal-sheet">
            <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:20px;">
                <h2 id="itemModalTitle" style="margin:0">Detalle</h2>
                <span id="itemTimestamp" style="font-size:11px; color:#999;"></span>
            </div>
            
            <input type="hidden" id="itemId">
            
            <div class="form-group">
                <label class="form-label">Identificación</label>
                <div class="input-row">
                    <select id="itemNameSelect" class="form-select" style="flex:2">
                        <option value="PTL">PTL (Pasillo Tee)</option>
                        <option value="PLL">PLL (Lateral)</option>
                        <option value="PC">PC (Cruz)</option>
                        <option value="PCE">PCE (Central)</option>
                        <option value="Activo">Activo Gral.</option>
                    </select>
                    <input type="text" id="itemNumId" class="form-input" placeholder="ID (14)" style="flex:1">
                </div>
            </div>

            <div class="form-group">
                <label class="form-label">Código Inventario / Serie</label>
                <div class="input-row">
                    <input type="text" id="itemCode" class="form-input" placeholder="Serie...">
                    <button class="mic-btn" onclick="startVoice()">🎤</button>
                </div>
            </div>

            <div class="form-group">
                <label class="form-label">Estado Auditoría</label>
                <select id="itemStatus" class="form-select">
                    <option value="pending">⚪ Pendiente</option>
                    <option value="ok">🟢 Operativo / Verificado</option>
                    <option value="issue">🔴 Falla / Discrepancia</option>
                </select>
            </div>

            <div class="form-group">
                <label class="form-label">Observaciones</label>
                <textarea id="itemObs" class="form-input" rows="2"></textarea>
            </div>

            <button class="btn" style="width:100%" onclick="saveItem()">Guardar Cambios</button>
            <button class="btn btn-ghost" style="width:100%; margin-top:10px; color:#ff3b30" onclick="closeModal('modalItem')">Cerrar</button>
        </div>
    </div>

    <script>
        // --- CEREBRO V17 ---
        let currentProject = null;
        let projects = JSON.parse(localStorage.getItem('invPro_projects')) || [];
        let items = []; // Items del proyecto activo
        let selectionMode = false;
        let selectedItems = new Set();

        // Inicialización
        function init() {
            renderProjects();
        }

        // Navegación
        function nav(viewId) {
            document.querySelectorAll('.view').forEach(el => el.classList.remove('active'));
            document.querySelectorAll('.nav-item').forEach(el => el.classList.remove('active'));
            document.getElementById('view-' + viewId).classList.add('active');
            
            // Highlight navbar icon if exists
            const navBtn = document.getElementById('nav-' + viewId);
            if(navBtn) navBtn.classList.add('active');

            if(viewId === 'map') renderGrid();
            if(viewId === 'files') renderTree();
            if(viewId === 'list') renderList();
            if(viewId === 'projects') {
                currentProject = null;
                document.getElementById('headerActions').innerHTML = '<button class="btn" onclick="showNewProjectModal()">+ Nuevo</button>';
                document.getElementById('pageTitle').innerText = 'Proyectos';
                hideProjectNav();
            }
        }

        function hideProjectNav() {
            document.getElementById('nav-map').style.display = 'none';
            document.getElementById('nav-files').style.display = 'none';
            document.getElementById('nav-list').style.display = 'none';
        }

        function showProjectNav(type) {
            if(type === 'modular') document.getElementById('nav-map').style.display = 'block';
            document.getElementById('nav-files').style.display = 'block';
            document.getElementById('nav-list').style.display = 'block';
        }

        // --- GESTIÓN PROYECTOS ---
        function toggleProjectOptions() {
            const type = document.getElementById('npType').value;
            document.getElementById('modularOptions').style.display = type === 'modular' ? 'block' : 'none';
        }

        function createProject() {
            const p = {
                id: Date.now(),
                name: document.getElementById('npName').value,
                type: document.getElementById('npType').value, // standard | modular
                mode: document.getElementById('npMode').value, // survey | audit
                rows: parseInt(document.getElementById('npRows').value) || 2,
                cols: parseInt(document.getElementById('npCols').value) || 6,
                created: new Date().toLocaleDateString()
            };
            projects.push(p);
            localStorage.setItem('invPro_projects', JSON.stringify(projects));
            // Crear base de datos para items de este proyecto
            localStorage.setItem(`invPro_items_${p.id}`, JSON.stringify([]));
            closeModal('modalNewProject');
            renderProjects();
        }

        function renderProjects() {
            const list = document.getElementById('projectsList');
            list.innerHTML = '';
            projects.forEach(p => {
                const tagClass = p.type === 'modular' ? 'tag-modular' : 'tag-standard';
                const tagText = p.type === 'modular' ? 'BALSA / MODULAR' : 'BODEGA / ESTÁNDAR';
                
                list.innerHTML += `
                    <div class="card" onclick="openProject(${p.id})">
                        <span class="project-tag ${tagClass}">${tagText}</span>
                        <div class="item-title">${p.name}</div>
                        <div class="item-sub">${p.mode === 'audit' ? '🔍 Auditoría' : '📝 Levantamiento'} • ${p.created}</div>
                        <div style="position:absolute; right:15px; top:40%; color:#ccc">❯</div>
                    </div>
                `;
            });
        }

        function openProject(pid) {
            currentProject = projects.find(p => p.id === pid);
            items = JSON.parse(localStorage.getItem(`invPro_items_${pid}`)) || [];
            
            document.getElementById('pageTitle').innerText = currentProject.name;
            document.getElementById('headerActions').innerHTML = '<button class="btn btn-ghost" onclick="exportProject()">Exportar 📤</button>';
            
            showProjectNav(currentProject.type);
            
            // Si es modular, inicia en mapa, si no en lista
            if(currentProject.type === 'modular') nav('map');
            else nav('list');
        }

        // --- MAPA GRID SYSTEM (EL MONSTRUO) ---
        function renderGrid() {
            if(!currentProject || currentProject.type !== 'modular') return;
            
            const wrapper = document.getElementById('gridWrapper');
            const rows = currentProject.rows;
            const cages = currentProject.cols; 
            
            // Lógica de Grilla: 
            // Cada jaula está rodeada de pasillos.
            // Grilla Visual: (Filas * 2 + 1) x (Jaulas * 2 + 1)
            // Celdas pares = Pasillos, Impares = Jaulas
            
            const gridRows = rows * 2 + 1;
            const gridCols = cages * 2 + 1;
            
            wrapper.style.gridTemplateColumns = `repeat(${gridCols}, 1fr)`;
            wrapper.innerHTML = '';

            for(let r=0; r<gridRows; r++) {
                for(let c=0; c<gridCols; c++) {
                    const cell = document.createElement('div');
                    cell.className = 'grid-cell';
                    
                    // Determinar Tipo de Celda
                    const isRowOdd = r % 2 !== 0; // Es fila de jaula
                    const isColOdd = c % 2 !== 0; // Es col de jaula
                    
                    let type = '';
                    let label = '';
                    
                    if(isRowOdd && isColOdd) {
                        // Es el hueco de la jaula (Módulo)
                        type = 'cage';
                        label = `M-${Math.ceil(r/2)}${Math.ceil(c/2)}`;
                    } else {
                        // Es Pasillo
                        const isCorner = (r === 0 || r === gridRows-1) && (c === 0 || c === gridCols-1);
                        const isEdgeRow = r === 0 || r === gridRows-1;
                        const isEdgeCol = c === 0 || c === gridCols-1;
                        
                        if (isEdgeRow && !isColOdd && isEdgeCol) type = 'tee'; // Esquina real
                        else if (isEdgeRow && !isColOdd) type = 'tee'; // Cabeceras Tee (Verde)
                        else if (isEdgeCol && !isRowOdd) type = 'side'; // Lateral Exterior (Azul)
                        else if (!isRowOdd && !isColOdd) type = 'cross'; // Cruce Interno (Naranja)
                        else type = 'central'; // Pasillo Interno (Morado)
                        
                        // Verificar si existe dato guardado para esta coordenada
                        const coordID = `grid-${r}-${c}`;
                        const existingItem = items.find(i => i.gridId === coordID);
                        
                        if(existingItem) {
                            label = existingItem.code || existingItem.numId;
                            cell.classList.add(existingItem.status === 'ok' ? 'status-ok' : (existingItem.status === 'issue' ? 'status-issue' : 'status-pending'));
                        } else {
                            label = '+';
                        }
                        
                        cell.onclick = () => openItemModal(coordID, type);
                    }
                    
                    cell.classList.add('cell-'+type);
                    cell.innerText = label;
                    wrapper.appendChild(cell);
                }
            }
        }

        // --- MODALES Y EDICIÓN ---
        function openItemModal(gridId = null, suggestedType = 'Activo') {
            const modal = document.getElementById('modalItem');
            const item = items.find(i => i.gridId === gridId) || {
                id: Date.now(),
                gridId: gridId,
                name: mapTypeToName(suggestedType),
                numId: '',
                code: '',
                status: 'pending',
                obs: ''
            };

            document.getElementById('itemId').value = item.id;
            // Si es nuevo, asignamos gridId en un atributo dataset para guardarlo luego
            document.getElementById('itemId').dataset.gridId = gridId || ''; 
            
            document.getElementById('itemNameSelect').value = item.name;
            document.getElementById('itemNumId').value = item.numId;
            document.getElementById('itemCode').value = item.code;
            document.getElementById('itemStatus').value = item.status;
            document.getElementById('itemObs').value = item.obs;
            document.getElementById('itemTimestamp').innerText = item.timestamp ? `Auditado: ${item.timestamp}` : '';

            modal.style.display = 'flex';
        }

        function mapTypeToName(type) {
            if(type === 'tee') return 'PTL';
            if(type === 'side') return 'PLL';
            if(type === 'cross') return 'PC';
            if(type === 'central') return 'PCE';
            return 'Activo';
        }

        function saveItem() {
            const id = parseInt(document.getElementById('itemId').value);
            const gridId = document.getElementById('itemId').dataset.gridId;
            
            const newItem = {
                id: id,
                gridId: gridId, // Mantiene la coordenada si viene del mapa
                name: document.getElementById('itemNameSelect').value,
                numId: document.getElementById('itemNumId').value,
                code: document.getElementById('itemCode').value,
                status: document.getElementById('itemStatus').value,
                obs: document.getElementById('itemObs').value,
                timestamp: new Date().toLocaleString() // Sello de tiempo V17
            };

            const index = items.findIndex(i => i.id === id);
            if(index >= 0) items[index] = newItem;
            else items.push(newItem);

            localStorage.setItem(`invPro_items_${currentProject.id}`, JSON.stringify(items));
            closeModal('modalItem');
            
            // Actualizar vistas
            if(document.getElementById('view-map').classList.contains('active')) renderGrid();
            if(document.getElementById('view-list').classList.contains('active')) renderList();
        }

        // --- LISTADO Y BULK ACTIONS ---
        function renderList() {
            const filter = document.getElementById('searchInput').value.toLowerCase();
            const listEl = document.getElementById('inventoryList');
            listEl.innerHTML = '';

            items.forEach(item => {
                if((item.code + item.name + item.numId).toLowerCase().includes(filter)) {
                    const statusIcon = item.status === 'ok' ? '🟢' : (item.status === 'issue' ? '🔴' : '⚪');
                    const html = `
                    <div class="list-item" onclick="handleItemClick(${item.id})">
                        <input type="checkbox" class="item-check" ${selectedItems.has(item.id) ? 'checked' : ''} onclick="event.stopPropagation(); toggleSelect(${item.id})">
                        <div class="item-info">
                            <div class="item-title">${statusIcon} ${item.name} ${item.numId}</div>
                            <div class="item-sub">Cod: ${item.code} | ${item.timestamp || 'Sin auditar'}</div>
                        </div>
                    </div>`;
                    listEl.innerHTML += html;
                }
            });
        }

        function toggleSelect(id) {
            if(selectedItems.has(id)) selectedItems.delete(id);
            else selectedItems.add(id);
            updateBulkBar();
        }

        function updateBulkBar() {
            const bar = document.getElementById('bulkBar');
            if(selectedItems.size > 0) {
                bar.style.display = 'flex';
                document.getElementById('selectedCount').innerText = `${selectedItems.size} seleccionados`;
            } else {
                bar.style.display = 'none';
            }
        }

        function cancelBulk() {
            selectedItems.clear();
            updateBulkBar();
            renderList();
        }

        function deleteBulk() {
            if(!confirm("¿Borrar items seleccionados?")) return;
            items = items.filter(i => !selectedItems.has(i.id));
            localStorage.setItem(`invPro_items_${currentProject.id}`, JSON.stringify(items));
            cancelBulk();
        }
        
        function handleItemClick(id) {
            // Si hay selección masiva activa, clic selecciona en vez de abrir
            if(selectedItems.size > 0) {
                toggleSelect(id);
                renderList(); // Re-render para actualizar checkbox
            } else {
                // Truco: buscamos el item y abrimos el modal simulando gridId
                const item = items.find(i => i.id === id);
                document.getElementById('itemId').value = item.id;
                document.getElementById('itemId').dataset.gridId = item.gridId; 
                openItemModal(item.gridId, 'Activo');
                // Llenamos manualmente porque openItemModal crea uno nuevo si no machea ID
                document.getElementById('itemNameSelect').value = item.name;
                document.getElementById('itemNumId').value = item.numId;
                document.getElementById('itemCode').value = item.code;
                document.getElementById('itemStatus').value = item.status;
                document.getElementById('itemObs').value = item.obs;
                document.getElementById('itemTimestamp').innerText = `Auditado: ${item.timestamp}`;
            }
        }

        // --- UTILIDADES ---
        function startVoice() {
            // Simulación simple. En iOS Safari requiere API webkitSpeechRecognition
            alert("🔊 Escuchando... (Dicta el código)");
            // En producción real se conecta a la API. Aquí simulo un input.
            const simulacion = prompt("Simulación de Voz: Ingresa código");
            if(simulacion) document.getElementById('itemCode').value = simulacion;
        }

        function showNewProjectModal() { document.getElementById('modalNewProject').style.display = 'flex'; }
        
        function closeModal(id) { document.getElementById(id).style.display = 'none'; }

        // --- EXPORTACIÓN EXCEL PRO (CSS STYLED) ---
        function exportProject() {
            let table = `
                <table border="1">
                    <thead>
                        <tr style="background:#007aff; color:white;">
                            <th>Ubicación Visual</th>
                            <th>Tipo</th>
                            <th>ID Pasillo</th>
                            <th>Código Inventario</th>
                            <th>Estado</th>
                            <th>Observación</th>
                            <th>Timestamp</th>
                        </tr>
                    </thead>
                    <tbody>
            `;
            
            items.forEach(i => {
                let color = '#fff';
                if(i.status === 'issue') color = '#ffcccc';
                if(i.status === 'ok') color = '#ccffcc';
                
                table += `
                    <tr style="background:${color}">
                        <td>${i.gridId ? i.gridId : 'N/A'}</td>
                        <td>${i.name}</td>
                        <td>${i.numId}</td>
                        <td><b>${i.code}</b></td>
                        <td>${i.status}</td>
                        <td>${i.obs}</td>
                        <td>${i.timestamp}</td>
                    </tr>
                `;
            });
            table += '</tbody></table>';

            const blob = new Blob(['\ufeff', table], { type: 'application/vnd.ms-excel' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `Reporte_${currentProject.name}.xls`;
            a.click();
        }

        // --- BOOT ---
        window.onload = init;

    </script>
</body>
